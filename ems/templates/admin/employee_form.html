{% extends "base.html" %}
{% block title %}{{ 'Edit' if employee else 'Add' }} Employee{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit employee' if employee else 'Add employee' }}</h1>
</div>

<div class="card-flat" style="max-width: 640px;">
  <form method="post">
    {% if not employee %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label">Full name</label>
      <input type="text" class="form-control" name="full_name" value="{{ employee.full_name if employee else '' }}" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" name="phone" value="{{ employee.phone if employee else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Designation</label>
        <input type="text" class="form-control" name="designation" value="{{ employee.designation if employee else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" class="form-control" name="address" value="{{ employee.address if employee else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Department</label>
      <select class="form-select" name="department_id">
        <option value="">— None —</option>
        {% for d in departments %}
        <option value="{{ d.id }}" {% if employee and employee.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save changes' if employee else 'Add employee' }}</button>
    <a href="{{ url_for('admin.employees') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
