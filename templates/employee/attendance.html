{% extends "base.html" %}
{% block title %}My Attendance{% endblock %}
{% block content %}
<div class="page-header"><div><h1>My Attendance</h1><p class="text-muted mb-0">Track your attendance history.</p></div><form method="post"><button class="btn btn-primary"><i class="fa-solid fa-check me-1"></i>Mark Today Present</button></form></div>
<div class="card-flat"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>
{% for r in records %}<tr><td>{{ r.date }}</td><td><span class="badge badge-status-{{ r.status }}">{{ r.status }}</span></td></tr>{% else %}<tr><td colspan="2"><div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i><p>No attendance history yet.</p></div></td></tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
