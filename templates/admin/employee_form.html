{% extends "base.html" %}
{% block title %}{{ 'Edit' if employee else 'Add' }} Employee{% endblock %}
{% block content %}
<div class="page-header"><div><a href="{{ url_for('admin.employees') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Employees</a><h1 class="mt-2">{{ 'Edit Employee' if employee else 'Add Employee' }}</h1></div></div>
<div class="card-flat form-card"><form method="post">
{% if not employee %}<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div><div class="col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div></div><label class="form-label">Password</label><input type="password" class="form-control mb-3" name="password" required>{% endif %}
<label class="form-label">Full Name</label><input class="form-control mb-3" name="full_name" value="{{ employee.full_name if employee else '' }}" required>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ employee.phone if employee else '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Designation</label><input class="form-control" name="designation" value="{{ employee.designation if employee else '' }}"></div></div>
<label class="form-label">Address</label><input class="form-control mb-3" name="address" value="{{ employee.address if employee else '' }}">
<label class="form-label">Department</label><select class="form-select mb-4" name="department_id"><option value="">— None —</option>{% for d in departments %}<option value="{{ d.id }}" {% if employee and employee.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
<button class="btn btn-primary">{{ 'Save Changes' if employee else 'Add Employee' }}</button> <a href="{{ url_for('admin.employees') }}" class="btn btn-light">Cancel</a>
</form></div>
{% endblock %}
